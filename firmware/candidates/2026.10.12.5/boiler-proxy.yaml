# Self-contained network layer: MQTT can be configured from the ESP web UI.
mqtt:
  id: mqtt_client
  broker: "127.0.0.1"
  port: 1883
  enable_on_boot: false
  reboot_timeout: 0s
  wait_for_connection: false
  discovery: true
  discover_ip: false
  discovery_retain: true
  topic_prefix: "office/boiler"

text:
  - platform: template
    id: mqtt_host_cfg
    name: "MQTT сервер CFG"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    internal: true

  - platform: template
    id: mqtt_port_cfg
    name: "MQTT порт CFG"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "1883"
    min_length: 1
    max_length: 5
    internal: true

  - platform: template
    id: mqtt_user_cfg
    name: "MQTT логин CFG"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    internal: true

  - platform: template
    id: mqtt_password_cfg
    name: "MQTT пароль CFG"
    mode: password
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    internal: true

script:
  - id: mqtt_apply_config
    mode: restart
    then:
      - lambda: |-
          const std::string host = id(mqtt_host_cfg).state;
          if (host.empty()) {
            ESP_LOGI("mqtt_cfg", "MQTT broker is not configured; MQTT stays disabled");
            id(mqtt_client).disable();
            return;
          }
          int parsed_port = atoi(id(mqtt_port_cfg).state.c_str());
          if (parsed_port < 1 || parsed_port > 65535) parsed_port = 1883;
          id(mqtt_client).disable();
          id(mqtt_client).set_broker_address(host);
          id(mqtt_client).set_broker_port((uint16_t) parsed_port);
          id(mqtt_client).set_username(id(mqtt_user_cfg).state);
          id(mqtt_client).set_password(id(mqtt_password_cfg).state);
          id(mqtt_client).enable();
          ESP_LOGI("mqtt_cfg", "MQTT configuration applied: %s:%d", host.c_str(), parsed_port);

button:
  - platform: restart
    id: esp_restart_button
    name: "Перезагрузить ESP"
    internal: true

  - platform: template
    id: mqtt_apply_button
    name: "MQTT применить CFG"
    internal: true
    on_press:
      - script.execute: mqtt_apply_config

binary_sensor:
  - platform: template
    id: mqtt_connected_status
    name: "MQTT подключен STATUS"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(mqtt_client).is_connected();

text_sensor:
  - platform: template
    id: firmware_version_status
    name: "Версия прошивки FW"
    entity_category: diagnostic
    lambda: |-
      return {"${firmware_version}"};
    update_interval: 60s

  - platform: template
    id: firmware_capabilities_status
    name: "Возможности CAPABILITIES"
    entity_category: diagnostic
    lambda: |-
      return {"SAFE_PASSIVE_BRIDGE;MQTT_DIAGNOSTICS;LEGACY_OBSERVER;CONTROLS_DISABLED;OFFICE_WIFI"};
    update_interval: 60s

  - platform: wifi_info
    ip_address:
      id: wifi_ip_status
      name: "WiFi IP STATUS"
      entity_category: diagnostic
    ssid:
      id: wifi_ssid_status
      name: "WiFi SSID STATUS"
      entity_category: diagnostic

sensor:
  - platform: wifi_signal
    id: wifi_rssi_status
    name: "WiFi RSSI STATUS"
    entity_category: diagnostic
    update_interval: 15s

  - platform: uptime
    id: esp_uptime_status
    name: "ESP Uptime STATUS"
    entity_category: diagnostic
    update_interval: 30s
