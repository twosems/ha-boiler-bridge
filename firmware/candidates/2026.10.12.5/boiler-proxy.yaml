substitutions:
  firmware_version: "2026.10.12.5"

esphome:
  name: boiler-proxy
  friendly_name: Котёл UART Proxy
  on_boot:
    - priority: -100
      then:
        - delay: 2s
        - script.execute: mqtt_apply_config
esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      # The custom transport owns boot validation and enables IDF rollback.
      enable_ota_rollback: false

# UART0 goes only to the USB CP210x adapter. It is intentionally kept
# separate from the two boiler/display UART links on GPIO16/17/18/19.
logger:
  baud_rate: 115200
  level: WARN

# Office deployment profile. Values live only in the untracked secrets.yaml.
wifi:
  ssid: !secret office_wifi_ssid
  password: !secret office_wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  ap:
    ssid: "Boiler-Setup"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 2
  css_include: "www/boiler.css"
  js_include: "www/boiler.js"
  js_url: ""
  include_internal: true

improv_serial:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

safe_mode:
  disabled: true

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lambda: id(transport).set_maintenance(true);
    on_error:
      then:
        - lambda: id(transport).set_maintenance(false);
external_components:
  - source:
      type: local
      path: components

boiler_transport_v4:
  id: transport
  observer_enabled: true
  external_mirror_consumer: true
  allow_boot_confirm: true
  diagnostics:
    name: "Мост диагностика BRIDGE_DIAG"

boiler_proxy:
  id: boiler
  transport_id: transport

  current_page:
    name: "Текущая страница PAGE"
